[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedmodel"
version = "0.1.0"
description = "Inpatient bed demand by ward type: Monte Carlo simulation of occupancy, tested against a known truth on synthetic data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Wright" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "tabulate>=0.9"]
app = ["streamlit>=1.50", "altair>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
